name: Generate GitHub Trophies

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Trophies
        uses: lowlighter/metrics@latest
        with:
          filename: trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          
          # এটি অটোমেটিক আপনার বর্তমান ব্রাঞ্চ (main বা master) খুঁজে সেখানে সেভ করবে
          committer_branch: ${{ github.ref_name }}
          committer_message: "Force update GitHub Trophies"
          
          base: ""
          plugin_trophies: yes
          plugin_trophies_ignored: followers, issues, pullrequest, reviews
          config_theme: dark
